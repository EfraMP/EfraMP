name: Update README cards

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        run: |
          curl -s "https://github-readme-stats-yo-15e2.vercel.app/api?username=EfraMp&show_icons=true&theme=github_dark" \
            -o profile/stats.svg

      - name: Generate top languages card
        run: |
          curl -s "https://github-readme-stats-yo-15e2.vercel.app/api/top-langs/?username=EfraMp&layout=donut&hide=HTML,Jupyter%20Notebook,TeX&count_private=true&theme=github_dark&exclude_repo=hover-paywalls-browser-extension" \
            -o profile/langs.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
